name: Bug report
description: Report incorrect behaviour without sharing private filenames or paths.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities or private data exposure, stop and use SECURITY.md instead."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0 (6)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac type
      placeholder: "macOS 14.7, Apple silicon"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Remove usernames, filenames, personal paths, and other private information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
